services:
  # ─── Laravel App (PHP-FPM) ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobmind-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-jobmind}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jobmind

  # ─── Nginx Web Server ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: jobmind-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - jobmind

  # ─── PostgreSQL Database ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: jobmind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jobmind}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-jobmind}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobmind

  # ─── Laravel Queue Worker ───────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobmind-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    mem_limit: 256m
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-jobmind}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jobmind

  # ─── Python Scraper API ─────────────────────────────────────────
  scraper:
    build:
      context: .
      dockerfile: docker/scraper/Dockerfile
    container_name: jobmind-scraper
    restart: unless-stopped
    ports:
      - "${SCRAPER_PORT:-8000}:8000"
    volumes:
      - ./scraper_api:/app
    networks:
      - jobmind

volumes:
  pgdata:
    driver: local

networks:
  jobmind:
    driver: bridge
